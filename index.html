
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Internship Smart Allocation</title>
</head>
<body>

    <h1>AI-Based Smart Allocation</h1>
    <h2>PM Internship Scheme</h2>

    <p>Welcome to the Internship Allocation Portal!</p>

    <h3>Candidate Registration</h3>

    <form action="/register" method="POST">
        <label>Full Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Education:</label>
        <input type="text" name="education" required>
        <br><br>

        <label>Skills:</label>
        <input type="text" name="skills" placeholder="Python, Java..." required>
        <br><br>

        <label>Preferred Location:</label>
        <input type="text" name="location" required>
        <br><br>

        <label>Internship Interest:</label>
        <input type="text" name="interest" required>
        <br><br>

        <button type="submit">Register</button>
    </form>

</body>
</html>
